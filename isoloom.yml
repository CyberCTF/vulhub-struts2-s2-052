# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Apache Struts2 S2-052 REST Plugin XStream RCE (Vulhub, by phith0n and the Vulhub contributors) as an Isoloom spec:
# Vulhub's struts2/s2-052, vendored in app/, run from the published image vulhub/struts2:2.5.12-rest-showcase.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: vulhub-struts2-s2-052

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs: [CTF_FLAG_MAIN]

networks:
  lab: { cidr: 10.61.12.0/24, internet: false }

machines:
  struts2:
    networks: { lab: 10 }
    services: [{ port: 8080, name: web, http: true, publish: 8080 }]
    resources: { cpus: 1, memory_mb: 512 }
    inputs: [CTF_FLAG_MAIN]
    volumes: { ctf: /ctf }   # the flag, written by ctf/flag.sh at every start
    docker:
      image: vulhub/struts2:2.5.12-rest-showcase
      init: [ctf/flag.sh]

checks:
  - name: the application answers
    http: http://struts2:8080/orders.xhtml
    wait: 120
  - name: the REST showcase lists its orders
    script: checks/app.sh
    wait: 60

message: |
  The Struts2 2.5.12 REST showcase answers at http://localhost:{{ machines.struts2.services.0.publish }}/orders.xhtml.
  The REST plugin picks a handler from the extension or the Content-Type. What reads XML?
